# Local infrastructure: PostgreSQL only. The app itself runs via ./mvnw or java -jar.
# Credentials come from .env (copy .env.example). The port is bound to 127.0.0.1 only.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: engplat
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d engplat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
